<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>午餐订餐助手</title>
<style>
  :root {
    --orange: #FF6B35;
    --orange-light: #FFF3EE;
    --green: #52c41a;
    --green-bg: #f6ffed;
    --red: #ff4d4f;
    --red-bg: #fff2f0;
    --text: #222;
    --text-light: #666;
    --border: #f0f0f0;
    --bg: #f7f8fa;
    --white: #fff;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .tabs { display: flex; background: var(--white); padding: 0 24px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .tab { flex: 1; text-align: center; padding: 14px 0; font-size: 15px; color: var(--text-light); cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; }
  .tab.active { color: var(--orange); border-bottom-color: var(--orange); font-weight: 600; }

  .page { display: none; padding: 16px 16px 100px; max-width: 600px; margin: 0 auto; }
  .page.active { display: block; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--white); border-radius: var(--radius); padding: 32px 24px; width: 100%; max-width: 360px; }
  .modal h3 { font-size: 18px; margin-bottom: 16px; text-align: center; }
  .modal input { width: 100%; padding: 12px 16px; border: 1.5px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; transition: border-color .2s; }
  .modal input:focus { border-color: var(--orange); }
  .modal-btn { width: 100%; padding: 13px; background: var(--orange); color: #fff; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; margin-top: 16px; font-weight: 600; }

  .week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .week-nav-btn { width: 40px; height: 40px; border: 1px solid var(--border); background: var(--white); border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .week-nav-btn:active { background: var(--orange-light); }
  .week-title { font-size: 15px; font-weight: 600; }
  .week-title span { color: var(--orange); }

  .day-card { background: var(--white); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; }
  .day-card.work { border-left: 4px solid var(--green); }
  .day-card.holiday { border-left: 4px solid var(--red); }
  .day-card.today { box-shadow: 0 0 0 2px var(--orange), var(--shadow); }

  .day-left { min-width: 52px; }
  .day-name { font-size: 13px; font-weight: 600; }
  .day-date { font-size: 12px; color: var(--text-light); }
  .status-tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-top: 4px; cursor: pointer; }
  .status-tag.work { background: var(--green-bg); color: var(--green); }
  .status-tag.holiday { background: var(--red-bg); color: var(--red); }

  .day-center { flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .btn-count { width: 36px; height: 36px; border-radius: 50%; border: none; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .1s; }
  .btn-count:active { transform: scale(0.92); }
  .btn-m { background: var(--red-bg); color: var(--red); }
  .btn-p { background: var(--orange-light); color: var(--orange); }
  .day-num { font-size: 28px; font-weight: 700; min-width: 40px; text-align: center; }
  .day-num.readonly { font-size: 22px; color: #ccc; }

  .day-right { min-width: 90px; }
  .note-input { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; background: var(--bg); transition: border-color .2s; }
  .note-input:focus { border-color: var(--orange); background: #fff; }
  .note-input.has-note { border-color: var(--orange-light); background: var(--orange-light); }
  .editor-tag { font-size: 11px; color: #999; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .summary { background: var(--white); border-radius: var(--radius); padding: 20px; margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; box-shadow: var(--shadow); }
  .sum-item { text-align: center; }
  .sum-val { font-size: 26px; font-weight: 700; color: var(--orange); }
  .sum-label { font-size: 12px; color: var(--text-light); margin-top: 4px; }

  .legend { margin-top: 20px; padding: 16px; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-light); margin-bottom: 8px; }
  .legend-item:last-child { margin-bottom: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-work { background: var(--green); }
  .dot-holiday { background: var(--red); }

  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px; background: var(--white); border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center; max-width: 600px; margin: 0 auto; z-index: 20; }
  .btn-save { flex: 1; padding: 14px; background: var(--orange); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn-save:active { opacity: 0.88; }
  .btn-export { padding: 14px 18px; background: var(--bg); color: var(--text-light); border: 1px solid var(--border); border-radius: 12px; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .btn-export:active { background: var(--orange-light); }

  .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.75); color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 15px; z-index: 200; display: none; pointer-events: none; }
  .toast.show { display: block; animation: fadeToast .5s ease forwards; animation-delay: 1.5s; }
  @keyframes fadeToast { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0} }

  .month-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
  .month-tab { padding: 6px 14px; border-radius: 20px; font-size: 13px; background: var(--white); border: 1px solid var(--border); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .month-tab.active { background: var(--orange); color: #fff; border-color: var(--orange); }

  .stat-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--white); border-radius: var(--radius); padding: 16px 12px; text-align: center; box-shadow: var(--shadow); }
  .stat-card .val { font-size: 24px; font-weight: 700; color: var(--orange); }
  .stat-card .lbl { font-size: 12px; color: var(--text-light); margin-top: 4px; }

  .month-table { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .mt-head, .mt-row { display: grid; grid-template-columns: 1fr 60px 60px 80px; padding: 12px 16px; font-size: 13px; align-items: center; }
  .mt-head { background: var(--bg); font-weight: 600; color: var(--text-light); font-size: 12px; }
  .mt-row { border-top: 1px solid var(--border); }
  .mt-row.holiday { opacity: 0.6; }
  .mt-row.today-row { background: var(--orange-light); }
  .mt-date { font-size: 12px; color: var(--text-light); }
  .mt-label { }
  .mt-count { font-weight: 700; }
  .mt-editor { font-size: 11px; color: #999; }
  .mt-empty { text-align: center; color: #ccc; padding: 40px; font-size: 14px; }

  .editor-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px; padding: 16px; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); }
  .editor-chip { padding: 4px 10px; background: var(--orange-light); color: var(--orange); border-radius: 20px; font-size: 12px; }

  .loading { text-align: center; padding: 40px; color: #ccc; font-size: 14px; }
  .sync-indicator { position: fixed; top: 60px; right: 16px; background: var(--orange); color: #fff; font-size: 12px; padding: 6px 12px; border-radius: 20px; z-index: 50; display: none; }
  .sync-indicator.show { display: block; }
</style>
</head>
<body>

<div class="sync-indicator" id="sync-indicator">同步中...</div>

<div class="tabs">
  <div class="tab active" id="tab-week" onclick="switchTab('week')">本周订餐</div>
  <div class="tab" id="tab-stats" onclick="switchTab('stats')">月度统计</div>
</div>

<div class="page active" id="page-week">
  <div class="week-nav">
    <button class="week-nav-btn" onclick="prevWeek()">‹</button>
    <div class="week-title"><span id="week-range"></span></div>
    <button class="week-nav-btn" onclick="nextWeek()">›</button>
  </div>
  <div id="week-days"><div class="loading">加载中...</div></div>
  <div class="summary">
    <div class="sum-item"><div class="sum-val" id="total-count">0</div><div class="sum-label">本周总份</div></div>
    <div class="sum-item"><div class="sum-val" id="work-day-count">0</div><div class="sum-label">工作天数</div></div>
    <div class="sum-item"><div class="sum-val" id="avg-count">0</div><div class="sum-label">日均</div></div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="dot dot-work"></div><span>绿色「班」= 调休上班日，汇总统计</span></div>
    <div class="legend-item"><div class="dot dot-holiday"></div><span>红色「休」= 节假日/周末，份数可填但不计入汇总</span></div>
    <div class="legend-item"><span style="font-size:12px;color:#bbb;">点击「班/休」切换 · 谁编辑谁留痕</span></div>
  </div>
</div>

<div class="page" id="page-stats">
  <div class="month-tabs" id="month-tabs"></div>
  <div id="stats-content"></div>
</div>

<div class="save-bar">
  <button class="btn-export" onclick="exportCSV()">导出CSV</button>
  <button class="btn-save" onclick="saveData()">保存本周</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="name-modal">
  <div class="modal">
    <h3>请输入你的名字</h3>
    <input type="text" id="name-input" placeholder="例如：张三" maxlength="20">
    <button class="modal-btn" onclick="confirmName()">确定</button>
  </div>
</div>

<script>
// ===== 配置 =====
const BIN_ID = '69e6e78faaba8821971ec397'
const MASTER_KEY = '$2a$10$eKT4YfZCLgRrnlC1LCpNrOh9hRQtOVcP2dTU1Yh0dLTpOac/49i9y'
const BIN_URL = 'https://api.jsonbin.io/v3/b/' + BIN_ID

const HOLIDAYS = [
  '2026-01-01','2026-01-26','2026-01-27','2026-01-28','2026-01-29','2026-01-30','2026-01-31',
  '2026-02-01','2026-02-02',
  '2026-04-04','2026-04-05','2026-04-06',
  '2026-05-01','2026-05-02','2026-05-03','2026-05-04','2026-05-05',
  '2026-06-19','2026-06-20','2026-06-21','2026-06-22',
  '2026-10-01','2026-10-02','2026-10-03','2026-10-04','2026-10-05','2026-10-06','2026-10-07','2026-10-08'
]
const WORKDAY_MAKEUP = [
  '2026-02-03','2026-02-04','2026-02-05','2026-02-06','2026-02-07','2026-02-08',
  '2026-04-06',
  '2026-05-09',
  '2026-05-28',
  '2026-06-28',
  '2026-10-10'
]

// ===== 工具函数 =====
function formatDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0')
  return y + '-' + m + '-' + day
}
function getDayName(d) { return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()] }
function isHoliday(s) { return HOLIDAYS.includes(s) }
function isWorkdayMakeup(s) { return WORKDAY_MAKEUP.includes(s) }
function getDayStatus(dateStr, d) {
  if (isWorkdayMakeup(dateStr)) return 'work'
  if (isHoliday(dateStr)) return 'holiday'
  const dow = d.getDay()
  return (dow === 0 || dow === 6) ? 'holiday' : 'work'
}
function getWeekDays(monday) {
  const days = []
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday)
    d.setDate(monday.getDate() + i)
    const ds = formatDate(d)
    const status = getDayStatus(ds, d)
    days.push({
      date: ds,
      label: getDayName(d),
      displayDate: (d.getMonth()+1) + '/' + d.getDate(),
      isWorkDay: status === 'work',
      status
    })
  }
  return days
}
function getMondayOf(date) {
  const d = new Date(date)
  const dow = d.getDay()
  const diff = dow === 0 ? -6 : 1 - dow
  d.setDate(d.getDate() + diff)
  return d
}
function toast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.remove('show')
  void t.offsetWidth
  t.classList.add('show')
}
function fmtTime(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0')
}
function syncIndicator(show) {
  const el = document.getElementById('sync-indicator')
  el.classList.toggle('show', show)
}

// ===== 数据层：jsonbin.io 云存储 =====
let allOrders = {}
let editorName = localStorage.getItem('lunch_editor') || ''
let currentWeekMonday = getMondayOf(new Date())
let currentMonth = new Date().getMonth()
let currentYear = new Date().getFullYear()
let localCache = null // 内存缓存

async function loadFromCloud() {
  try {
    const res = await fetch(BIN_URL + '/latest', {
      cache: 'no-store',
      headers: { 'X-Master-Key': MASTER_KEY }
    })
    if (res.ok) {
      const json = await res.json()
      const data = json.record || json
      localCache = data
      return data
    }
  } catch(e) {}
  return {}
}

async function saveToCloud(data) {
  syncIndicator(true)
  try {
    const res = await fetch(BIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': MASTER_KEY
      },
      body: JSON.stringify(data)
    })
    if (!res.ok) {
      toast('保存失败，请检查网络')
    }
  } catch(e) {
    toast('保存失败，请检查网络')
  }
  syncIndicator(false)
}

function getOrder(date) {
  return allOrders[date] || null
}

function setOrder(date, data) {
  const now = new Date()
  const t = fmtTime(now)
  const prev = allOrders[date] || {}
  const prevEditors = prev.lastEditor || []
  prevEditors.push({ name: editorName, time: t })
  if (prevEditors.length > 3) prevEditors.splice(0, prevEditors.length - 3)
  allOrders[date] = Object.assign({}, prev, data, { lastEditor: prevEditors, updatedAt: now.toISOString() })
  localCache = Object.assign({}, allOrders)
}

// ===== 界面渲染 =====
async function renderWeek() {
  // 加载云端数据
  if (!localCache) {
    document.getElementById('week-days').innerHTML = '<div class="loading">加载云端数据...</div>'
    allOrders = await loadFromCloud()
  } else {
    allOrders = Object.assign({}, localCache)
  }

  const monday = new Date(currentWeekMonday)
  const days = getWeekDays(monday)

  // 填充已保存的数据
  days.forEach(day => {
    const saved = getOrder(day.date)
    if (saved) {
      day.count = saved.count || 0
      day.note = saved.note || ''
      day.isWorkDay = saved.isWorkDay !== undefined ? saved.isWorkDay : day.isWorkDay
      day.lastEditor = saved.lastEditor || []
    } else {
      day.count = 0
      day.note = ''
      day.lastEditor = []
    }
  })

  const today = formatDate(new Date())
  const end = new Date(monday); end.setDate(monday.getDate() + 6)
  document.getElementById('week-range').textContent =
    (monday.getMonth()+1) + '月' + monday.getDate() + '日 - ' + (end.getMonth()+1) + '月' + end.getDate() + '日'

  const container = document.getElementById('week-days')
  container.innerHTML = days.map((day, i) => {
    const isToday = day.date === today
    const cardClass = 'day-card ' + day.status + (isToday ? ' today' : '')
    const statusLabel = day.isWorkDay ? '班' : '休'
    const statusClass = day.isWorkDay ? 'work' : 'holiday'
    const lastEditor = day.lastEditor && day.lastEditor.length > 0
      ? day.lastEditor[day.lastEditor.length - 1].name + ' ' + day.lastEditor[day.lastEditor.length - 1].time.split(' ')[1]
      : ''
    const noteVal = day.note ? 'value="' + day.note.replace(/"/g,'&quot;') + '"' : 'placeholder="备注"'
    return `<div class="${cardClass}" data-idx="${i}">
      <div class="day-left">
        <div class="day-name">${day.label}</div>
        <div class="day-date">${day.displayDate}</div>
        <div class="status-tag ${statusClass}" onclick="toggleStatus(${i})">${statusLabel}</div>
      </div>
      <div class="day-center">
        <button class="btn-count btn-m" onclick="changeCount(${i},-1)">−</button>
        <div class="day-num ${day.isWorkDay?'':'readonly'}">${day.count}</div>
        <button class="btn-count btn-p" onclick="changeCount(${i},1)">+</button>
      </div>
      <div class="day-right">
        <input class="note-input ${day.note?'has-note':''}" ${noteVal} data-idx="${i}" oninput="onNoteInput(this,${i})" maxlength="100">
        ${lastEditor ? '<div class="editor-tag">' + lastEditor + '</div>' : ''}
      </div>
    </div>`
  }).join('')

  updateSummary()
}

function updateSummary() {
  const monday = new Date(currentWeekMonday)
  const days = getWeekDays(monday)
  days.forEach(day => {
    const saved = getOrder(day.date)
    if (saved) {
      day.count = saved.count || 0
      day.isWorkDay = saved.isWorkDay !== undefined ? saved.isWorkDay : day.isWorkDay
    } else {
      day.count = 0
    }
  })
  const workDays = days.filter(d => d.isWorkDay)
  const total = workDays.reduce((s, d) => s + (d.count || 0), 0)
  document.getElementById('total-count').textContent = total
  document.getElementById('work-day-count').textContent = workDays.length
  document.getElementById('avg-count').textContent = workDays.length > 0 ? Math.round(total / workDays.length) : 0
}

// ===== 交互 =====
function changeCount(idx, delta) {
  const monday = new Date(currentWeekMonday)
  const days = getWeekDays(monday)
  const saved = getOrder(days[idx].date)
  let count = saved ? (saved.count || 0) : 0
  count = Math.max(0, count + delta)
  const note = saved ? (saved.note || '') : ''
  const isWorkDay = saved && saved.isWorkDay !== undefined ? saved.isWorkDay : days[idx].isWorkDay
  setOrder(days[idx].date, { count, note, isWorkDay })
  renderWeek()
}

function toggleStatus(idx) {
  const monday = new Date(currentWeekMonday)
  const days = getWeekDays(monday)
  const saved = getOrder(days[idx].date)
  const prevIsWorkDay = saved && saved.isWorkDay !== undefined ? saved.isWorkDay : days[idx].isWorkDay
  const newIsWorkDay = !prevIsWorkDay
  let count = saved ? (saved.count || 0) : 0
  let note = saved ? (saved.note || '') : ''
  if (!newIsWorkDay && !isWorkdayMakeup(days[idx].date)) {
    count = 0; note = ''
  }
  setOrder(days[idx].date, { count, note, isWorkDay: newIsWorkDay })
  renderWeek()
}

function onNoteInput(el, idx) {
  const val = el.value
  const monday = new Date(currentWeekMonday)
  const days = getWeekDays(monday)
  const saved = getOrder(days[idx].date)
  const count = saved ? (saved.count || 0) : 0
  const isWorkDay = saved && saved.isWorkDay !== undefined ? saved.isWorkDay : days[idx].isWorkDay
  setOrder(days[idx].date, { count, note: val, isWorkDay })
  el.className = 'note-input ' + (val ? 'has-note' : '')
  updateSummary()
}

async function saveData() {
  if (!editorName) { showNameModal(); return }
  // 合并本地+本周数据
  const monday = new Date(currentWeekMonday)
  const days = getWeekDays(monday)
  const t = fmtTime(new Date())
  days.forEach(day => {
    const saved = getOrder(day.date)
    if (!saved) return
    const prevEditors = saved.lastEditor || []
    const alreadyHas = prevEditors.some(e => e.name === editorName && e.time.startsWith(t.split(' ')[0]))
    if (!alreadyHas) {
      prevEditors.push({ name: editorName, time: t })
      if (prevEditors.length > 3) prevEditors.splice(0, prevEditors.length - 3)
      allOrders[day.date] = Object.assign({}, saved, { lastEditor: prevEditors })
    }
  })
  await saveToCloud(allOrders)
  localCache = Object.assign({}, allOrders)
  toast(editorName + ' 已保存')
  renderWeek()
}

function prevWeek() {
  const d = new Date(currentWeekMonday)
  d.setDate(d.getDate() - 7)
  currentWeekMonday = d
  localCache = null // 切周时重新加载
  renderWeek()
}
function nextWeek() {
  const d = new Date(currentWeekMonday)
  d.setDate(d.getDate() + 7)
  currentWeekMonday = d
  localCache = null
  renderWeek()
}

// ===== 月度统计 =====
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
  document.getElementById('tab-' + tab).classList.add('active')
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'))
  document.getElementById('page-' + tab).classList.add('active')
  if (tab === 'stats') renderStats()
}

function getMonths() {
  const months = []
  const now = new Date()
  for (let i = -6; i <= 1; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1)
    months.push({ y: d.getFullYear(), m: d.getMonth() })
  }
  return months
}

function renderMonthTabs() {
  const months = getMonths()
  const curY = currentYear, curM = currentMonth
  document.getElementById('month-tabs').innerHTML = months.map(m => {
    const active = m.y === curY && m.m === curM ? 'active' : ''
    return `<div class="month-tab ${active}" onclick="selectMonth(${m.y},${m.m})">${m.y}年${m.m+1}月</div>`
  }).join('')
}

function selectMonth(y, m) {
  currentYear = y; currentMonth = m
  renderMonthTabs()
  renderStats()
}

async function renderStats() {
  // 重新加载云端数据确保最新
  const data = await loadFromCloud()
  allOrders = data

  const monthAll = Object.keys(allOrders).filter(d => {
    const dt = new Date(d)
    return dt.getFullYear() === currentYear && dt.getMonth() === currentMonth
  }).sort()

  if (monthAll.length === 0) {
    document.getElementById('stats-content').innerHTML = '<div class="mt-empty">本月暂无数据</div>'
    return
  }

  const first = new Date(currentYear, currentMonth, 1)
  const last = new Date(currentYear, currentMonth + 1, 0)
  const days = []
  for (let d = new Date(first); d <= last; d.setDate(d.getDate() + 1)) {
    const ds = formatDate(d)
    const saved = allOrders[ds]
    const dayObj = getWeekDays(first).find(x => x.date === ds) || { isWorkDay: true }
    const status = getDayStatus(ds, d)
    const isWorkDay = saved && saved.isWorkDay !== undefined ? saved.isWorkDay : (status === 'work')
    days.push({
      date: ds,
      displayDate: (d.getMonth()+1) + '/' + d.getDate(),
      label: getDayName(d),
      count: saved ? (saved.count || 0) : 0,
      isWorkDay,
      status,
      lastEditor: saved && saved.lastEditor && saved.lastEditor.length > 0
        ? saved.lastEditor[saved.lastEditor.length - 1].name : ''
    })
  }

  const workDays = days.filter(d => d.isWorkDay)
  const total = workDays.reduce((s, d) => s + d.count, 0)
  const avg = workDays.length > 0 ? Math.round(total / workDays.length) : 0
  const today = formatDate(new Date())

  let html = `<div class="stat-cards">
    <div class="stat-card"><div class="val">${total}</div><div class="lbl">月度总份</div></div>
    <div class="stat-card"><div class="val">${workDays.length}</div><div class="lbl">工作天数</div></div>
    <div class="stat-card"><div class="val">${avg}</div><div class="lbl">日均</div></div>
  </div>`

  html += `<div class="month-table">
    <div class="mt-head"><span>日期</span><span>性质</span><span>份数</span><span>编辑人</span></div>
    ${days.map(d => {
      const isToday = d.date === today
      const rowClass = d.isWorkDay ? 'work' : 'holiday'
      const finalClass = isToday ? rowClass + ' today-row' : rowClass
      const dayLabel = d.isWorkDay ? '班' : '休'
      const labelClass = d.isWorkDay ? 'work' : 'holiday'
      return `<div class="mt-row ${finalClass}">
        <div class="mt-date"><span>${d.displayDate}</span><span style="margin-left:4px;color:#999;font-size:11px">${d.label}</span></div>
        <div class="mt-label"><span class="status-tag ${labelClass}">${dayLabel}</span></div>
        <div class="mt-count">${d.count}</div>
        <div class="mt-editor">${d.lastEditor || '-'}</div>
      </div>`
    }).join('')}
  </div>`

  const editors = [...new Set(days.filter(d => d.lastEditor).map(d => d.lastEditor))]
  if (editors.length > 0) {
    html += `<div class="editor-list">本月编辑过的人：${editors.map(e => '<span class="editor-chip">' + e + '</span>').join('')}</div>`
  }

  document.getElementById('stats-content').innerHTML = html
}

// ===== CSV导出 =====
function exportCSV() {
  if (!editorName) { showNameModal(); return }
  const monday = new Date(currentWeekMonday)
  const days = getWeekDays(monday)
  const lines = ['日期,星期,性质,份数,备注,最后编辑']
  days.forEach(day => {
    const saved = getOrder(day.date)
    if (!saved) return
    const label = day.isWorkDay ? '班' : '休'
    const lastEd = saved.lastEditor && saved.lastEditor.length > 0
      ? saved.lastEditor[saved.lastEditor.length - 1].name + ' ' + saved.lastEditor[saved.lastEditor.length - 1].time
      : ''
    lines.push(day.date + ',' + day.label + ',' + label + ',' + saved.count + ',"' + (saved.note||'') + '","' + lastEd + '"')
  })
  const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' })
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = '午餐订餐_' + formatDate(new Date()) + '.csv'
  a.click()
  URL.revokeObjectURL(url)
  toast('导出成功')
}

// ===== 名字弹窗 =====
function showNameModal() {
  document.getElementById('name-modal').classList.add('show')
  const inp = document.getElementById('name-input')
  inp.value = editorName
  inp.focus()
}
function confirmName() {
  const name = document.getElementById('name-input').value.trim() || '匿名'
  editorName = name
  localStorage.setItem('lunch_editor', name)
  document.getElementById('name-modal').classList.remove('show')
}

// ===== 初始化 =====
async function init() {
  renderMonthTabs()
  await renderWeek()
  if (!editorName) {
    setTimeout(showNameModal, 300)
  }
}
init()
